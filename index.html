<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DreaMusical</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" href="icona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DreaMusical">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra bianca con il logo e il cambio di persona, colonna con i propri gruppi a sinistra, una colonna di lavoro. Su telefono le sezioni diventano schede orizzontali. Colori presi dal logo: blu #242E63, azzurro #5B96BF. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#EDF4FA; --ink:#242E63; --ink2:#46517F; --muted:#6E7A9C; --line:#D6E3EF;
  --brand:#242E63; --brand2:#3A5A93; --on-brand:#FFFFFF; --sky:#5B96BF; --sky-ink:#3A76A3; --sky-soft:#DCEBF6; --light:#A8CFEA;
  --g-compagnia:#242E63; --g-direttivo:#6E7A9C; --g-segreti:#3A76A3; --g-sartoria:#5B96BF;
  --red:#B33A3A; --green:#2D7A4C; --orange:#B8620F;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow','Segoe UI',Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1430; --surface:#161E44; --soft:#1E2855; --ink:#EEF3FA; --ink2:#C8D3E8; --muted:#96A3C3; --line:#2B3668;
    --brand:#242E63; --brand2:#3A5A93; --on-brand:#FFFFFF; --sky:#7FB3DA; --sky-ink:#9CC6E6; --sky-soft:#22325F; --light:#A8CFEA;
    --g-compagnia:#9AA6E0; --g-direttivo:#A3AEC6; --g-segreti:#7FB3DA; --g-sartoria:#A9D0EC;
    --red:#EE8A84; --green:#7FD0A0; --orange:#EFA55A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1430; --surface:#161E44; --soft:#1E2855; --ink:#EEF3FA; --ink2:#C8D3E8; --muted:#96A3C3; --line:#2B3668;
  --brand:#242E63; --brand2:#3A5A93; --on-brand:#FFFFFF; --sky:#7FB3DA; --sky-ink:#9CC6E6; --sky-soft:#22325F; --light:#A8CFEA;
  --g-compagnia:#9AA6E0; --g-direttivo:#A3AEC6; --g-segreti:#7FB3DA; --g-sartoria:#A9D0EC;
  --red:#EE8A84; --green:#7FD0A0; --orange:#EFA55A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);color:var(--ink);text-wrap:balance;margin:0;font-weight:700;letter-spacing:.01em}
h1{font-size:2rem;line-height:1.1}
h2{font-size:1.35rem;line-height:1.2}
h3{font-size:1.12rem;line-height:1.25}
p{margin:0}
.svg{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* barra superiore: sempre bianca, come il fondo del logo */
.top{position:sticky;top:0;padding-top:calc(8px + env(safe-area-inset-top,0px)) !important;z-index:20;background:#FFFFFF;color:#242E63;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;border-bottom:3px solid #5B96BF}
.logo{height:46px;width:auto;display:block}
.roles{display:flex;gap:4px;background:#EDF4FA;padding:4px;border-radius:12px;margin-left:auto}
.roles button{border:0;background:transparent;color:#242E63;padding:7px 14px;border-radius:9px;font-weight:700;font-size:.92rem}
.roles button[aria-pressed="true"]{background:#242E63;color:#FFFFFF}
.roles .lab{color:#46517F;font-weight:600;font-size:.8rem;padding:0 6px 0 8px;align-self:center}
.tools{display:flex;gap:6px}
.tools button{border:1.5px solid #D6E3EF;background:#FFFFFF;color:#242E63;border-radius:9px;padding:7px 11px;font-size:.85rem;font-weight:700;display:flex;gap:6px;align-items:center}
.ribbon{background:var(--soft);color:var(--ink2);font-size:.84rem;padding:7px 16px;text-align:center;border-bottom:1px solid var(--line)}
.ribbon b{color:var(--ink)}

/* struttura */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:96px;align-self:start}
.who{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.who .n{font-weight:700;font-size:1.05rem}
.who .s{font-size:.86rem;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sep{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:12px 12px 4px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-weight:700;color:var(--ink2)}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--sky-soft);color:var(--ink)}
.nav .gd{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.nav button.out{color:var(--muted);font-weight:600}
.nav .lk{margin-left:auto;display:inline-flex;color:var(--muted)}
.gcard.out{background:var(--soft);border-style:dashed}
.gcard.out .gn{color:var(--muted)}
.gcard .lk{position:absolute;right:12px;top:12px;color:var(--muted)}
.nope{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 20px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--soft)}
.nope .big{width:64px;height:64px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--sky-ink)}
.nope .big .svg{width:30px;height:30px}
.nope h2{font-size:1.6rem}
.nope p{max-width:46ch;color:var(--ink2)}
.nav .cnt{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--brand);color:var(--on-brand);font-size:.75rem;display:grid;place-items:center;padding:0 6px}
.nav .cnt.warn{background:var(--orange);color:#FFFFFF}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--sky-ink)}
.sub{color:var(--ink2);max-width:64ch;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* bottoni */
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:var(--on-brand)}
.btn:hover{background:var(--brand2)}
.btn.sec{background:var(--sky-soft);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:7px 12px;font-size:.88rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.88rem;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sky)}

/* badge e gruppi */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.b-orange{background:color-mix(in srgb,var(--orange) 15%,var(--surface));color:var(--orange)}
.b-sky{background:var(--sky-soft);color:var(--sky-ink)}
.b-grey{background:var(--soft);color:var(--ink2)}
.g-compagnia{--c:var(--g-compagnia)} .g-direttivo{--c:var(--g-direttivo)} .g-segreti{--c:var(--g-segreti)} .g-sartoria{--c:var(--g-sartoria)}
.gtag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--c)}
.gtag::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}

/* i miei gruppi */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.gcard{border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px 12px 18px;text-align:left;position:relative;display:flex;flex-direction:column;gap:3px}
.gcard::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:0 4px 4px 0;background:var(--c)}
.gcard:hover{border-color:var(--sky)}
.gcard .gn{font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1.1}
.gcard .gx{font-size:.84rem;color:var(--muted)}
.lockline{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted)}

/* conto alla rovescia, stile insegna */
.marquee{background:linear-gradient(120deg,#242E63 0%,#2F4580 55%,#3A6FA3 100%);color:#FFFFFF;border-radius:var(--r);padding:0 18px;display:flex;flex-direction:column}
.bulbs{height:10px;background:radial-gradient(circle at 5px 5px,#A8CFEA 2.6px,transparent 3.2px) 0 0/16px 10px repeat-x}
.marquee .in{display:flex;gap:16px;align-items:center;padding:8px 0}
.marquee .v{font-family:var(--f-display);font-weight:700;font-size:3.1rem;line-height:1;color:#A8CFEA;font-variant-numeric:tabular-nums}
.marquee .t{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.marquee .d{font-size:.84rem;opacity:.85}
.marquee .castle{margin-left:auto;width:110px;height:55px;flex:none}
@media (max-width:560px){.marquee .castle{width:64px;height:32px}}

/* prossimo impegno */
.next{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.next .bar{height:6px;background:var(--c)}
.next .body{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.next .when{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.1}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px;font-size:.95rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mat{border:1.5px solid var(--line);background:var(--soft);border-radius:8px;padding:5px 10px;font-weight:600;font-size:.86rem;display:inline-flex;gap:6px;align-items:center}

/* elenco giorni */
.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.day.free{background:var(--soft);border-style:dashed}
.day.past{opacity:.6}
.date{display:flex;flex-direction:column;align-items:flex-start}
.date .dw{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.date .dn{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
.date .mo{font-size:.78rem;color:var(--muted)}
.evs{display:flex;flex-direction:column;min-width:0}
.ev{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;padding:9px 0 9px 12px;border-top:1px solid var(--line);position:relative}
.ev::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:4px;border-radius:2px;background:var(--c)}
.ev:first-child{border-top:0}
.ev .tm{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.92rem}
.ev .tt{font-weight:700}
.ev .mt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:3px;font-size:.86rem;color:var(--muted)}
.ev.dim .tt{color:var(--muted);font-weight:600}
.freeline{color:var(--muted);font-size:.95rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-weight:600}
.notice.ok{background:color-mix(in srgb,var(--green) 11%,var(--surface));color:var(--green);border:1px solid color-mix(in srgb,var(--green) 35%,var(--line))}
.notice.bad{background:color-mix(in srgb,var(--red) 10%,var(--surface));color:var(--red);border:1px solid color-mix(in srgb,var(--red) 32%,var(--line))}
.notice.warn{background:color-mix(in srgb,var(--orange) 10%,var(--surface));color:var(--orange);border:1px solid color-mix(in srgb,var(--orange) 32%,var(--line))}
.notice.info{background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.notice .svg{margin-top:2px}

/* persone */
.people{display:flex;flex-wrap:wrap;gap:6px}
.pp{font-size:.84rem;border-radius:8px;padding:3px 9px;background:var(--soft);color:var(--ink2);font-weight:600}
.pp i{font-style:normal;color:var(--muted);font-weight:500}
.pp.me{background:var(--sky-soft);color:var(--sky-ink)}

/* foglio */
.sheetwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.sheet{border-collapse:collapse;width:100%;min-width:900px;font-size:.9rem}
.sheet th,.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.sheet th{background:var(--soft);font-weight:700;color:var(--ink2);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.sheet td.rn{background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums;width:34px;text-align:center}
.sheet tr.edited td{background:color-mix(in srgb,var(--sky) 10%,var(--surface))}
.sheet tr.edited td.rn{background:color-mix(in srgb,var(--sky) 32%,var(--surface))}
.sheet tr.flag td.rn{background:color-mix(in srgb,var(--orange) 30%,var(--surface));color:var(--ink)}
.sheet select,.sheet input[type=text]{padding:5px 7px;font-size:.88rem;border-radius:7px}
.sheet .nm{display:flex;flex-direction:column;gap:5px;min-width:190px}
.sheet .cv{font-size:.82rem;color:var(--ink2);min-width:180px}
.sheet .cv b{color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.issues{display:flex;flex-direction:column;gap:8px}

/* matrice numeri e personaggi */
table.mx{border-collapse:collapse;font-size:.86rem;min-width:720px;width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:center}
.mx th{font-weight:700;color:var(--ink2);font-size:.78rem}
.mx td:first-child,.mx th:first-child{text-align:left;font-weight:700;color:var(--ink);white-space:nowrap}
.tog{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:#FFFFFF}
.tog[aria-pressed="true"]{background:#5B96BF;border-color:#5B96BF}

/* telefono */
.phone{background:#242E63;border-radius:38px;padding:12px;max-width:380px;box-shadow:0 18px 40px -18px rgba(36,46,99,.55)}
.screen{border-radius:28px;min-height:520px;padding:18px 14px 22px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#242E63 0%,#5B96BF 100%)}
.lock{color:#fff;text-align:center;padding:10px 0 14px}
.lock .h{font-family:var(--f-display);font-size:3.2rem;font-weight:700;line-height:1}
.lock .d{font-size:.92rem;opacity:.85}
.nt{background:rgba(255,255,255,.9);color:#242E63;border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.nt .ic{width:30px;height:30px;border-radius:8px;background:#242E63;color:#fff;display:grid;place-items:center}
.nt .hh{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:#46517F}
.nt .hh b{color:#242E63}
.nt p{font-size:.9rem;margin-top:2px}
.nt.fresh{box-shadow:0 0 0 2px #A8CFEA}

/* messaggio bacheca */
.wa{background:color-mix(in srgb,var(--green) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:.94rem}

/* toast, finestre, guida */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;z-index:50;max-width:min(560px,calc(100% - 32px));font-weight:600;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.veil{position:fixed;inset:0;background:rgba(14,20,48,.5);z-index:60;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:16px;max-width:580px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.x{margin-left:auto;border:0;background:var(--soft);color:var(--ink);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.guide{position:fixed;top:0;right:0;bottom:0;width:min(410px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:55;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:-16px 0 40px -24px rgba(0,0,0,.4)}
.gs{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.gs .nb{width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:.85rem}


/* programma del direttivo */
.monthnav .mlabel{font-family:var(--f-display);font-size:1.35rem;min-width:9ch;text-align:center}
.pubbar{background:var(--soft);border-radius:12px;padding:10px 12px}
.addday{border:1.5px dashed var(--line);background:transparent;color:var(--sky-ink);border-radius:9px;padding:6px 10px;font-weight:700;font-size:.86rem;margin-top:8px;align-self:flex-start}
.ev.flagged{background:color-mix(in srgb,var(--orange) 8%,var(--surface));border-radius:8px}
.btn.warn{background:var(--red);color:#FFFFFF}
.dlg.wide{max-width:720px}
.form{display:grid;gap:14px}
.fr3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fl{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9rem;color:var(--ink);min-width:0}
.fl .hint,.hint{font-weight:400;color:var(--muted);font-size:.82rem}
.fl input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:16px;font-weight:400;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{padding:2px}
.c{border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:5px 11px;font-size:.86rem;font-weight:600}
.c[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.preview{background:var(--sky-soft);border-radius:10px;padding:10px 12px;font-size:.9rem;color:var(--ink)}
.preview.empty{background:var(--soft);color:var(--muted)}
@media (max-width:560px){.fr3{grid-template-columns:minmax(0,1fr)}}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);padding:16px 16px 60px;gap:16px}
  .side{position:static}
  .who{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav .sep{display:none}
  .nav button{white-space:nowrap;flex:none}
  .roles{margin-left:0;order:3;width:100%}
  .roles .lab{display:none}
  .roles button{flex:1;padding:7px 4px}
  .tools{margin-left:auto}
  .tools .tx{display:none}
  .logo{height:38px}
}
@media (max-width:560px){
  h1{font-size:1.65rem}
  .day{grid-template-columns:minmax(0,1fr);gap:6px}
  .date{flex-direction:row;align-items:baseline;gap:8px}
  .date .dn{font-size:1.5rem}
  .ev{grid-template-columns:minmax(0,1fr);gap:2px}
  .kv{grid-template-columns:minmax(0,1fr);gap:2px}
  .kv dd{margin-bottom:6px}
  .marquee .v{font-size:2.5rem}
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:up .25s ease-out}
  @keyframes up{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
}
/* app vera: barra di stato del telefono, campi data e ora su iPhone */
html{-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;display:block;text-align:left;min-height:42px}
.fr3 > label{min-width:0}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.sync button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:6px 9px;display:flex;align-items:center}
.sync .bad{color:var(--red);font-weight:600}
.boot{max-width:520px;margin:40px auto;padding:0 16px;display:flex;flex-direction:column;gap:16px}
.boot img{height:52px;align-self:flex-start}
.boot input{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;width:100%;background:var(--surface);color:var(--ink)}
a.mat{text-decoration:none}
.dlg{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.dlg.wide{padding-top:0;padding-bottom:0}
.dlg .hd{position:sticky;top:0;margin:0 -20px;padding:16px 20px 12px;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.dlg .ft{position:sticky;bottom:0;margin:0 -20px;padding:12px 20px 16px;background:var(--surface);z-index:2;border-top:1px solid var(--line);flex-wrap:wrap;gap:8px}
html.modale-aperta,html.modale-aperta body{overflow:hidden}
.c{min-height:38px}
@media (max-width:700px){
  .veil{padding:0;place-items:stretch}
  .veil > .dlg.wide{max-width:none;max-height:none;height:100%;border-radius:0;padding:0 16px}
  .dlg.wide .hd{margin:0 -16px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
  .dlg.wide .ft{margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .dlg.wide .ft > .row{flex:1;flex-wrap:nowrap}
  .dlg.wide .ft > .row .btn{flex:1;white-space:nowrap}
  .fr3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .fr3 > :first-child{grid-column:1/-1}
}
</style>

const GG = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const MM = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
function dt(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); }
function fmtDay(iso){ const x = dt(iso); return GG[x.getDay()]+" "+x.getDate()+" "+MM[x.getMonth()]; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function daysTo(a,b){ return Math.round((dt(b)-dt(a))/864e5); }
function mins(t){ const [h,m] = t.split(".").map(Number); return h*60+m; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pname(id){ return P[id] ? P[id].n : id; }
function memberOf(pid, g){ return !!(P[pid] && P[pid].g.includes(g)); }
function inGroup(pid, g){ if(ME && pid === ME.id) return ME.vede.includes(g); return memberOf(pid, g); }
function listIt(a){ return a.length <= 1 ? a.join("") : a.slice(0,-1).join(", ")+" e "+a.at(-1); }
function byTime(a,b){ return a.date === b.date ? mins(a.start)-mins(b.start) : a.date < b.date ? -1 : 1; }
function dot(t){ return /\.$/.test(t) ? t : t + "."; }
function chLabel(c){ return c === "Ensemble" ? "ensemble" : c; }

/* chi è in una scena: un suo personaggio è in scena, oppure è dell'ensemble e non è stato escluso */
function inScene(pid, sc){
  const p = P[pid];
  if(p.ch.some(c => c !== "Ensemble" && sc.on.includes(c))) return true;
  return p.ch.includes("Ensemble") && sc.on.includes("Ensemble") && !sc.ensOut.includes(pid);
}
function castOf(chars){ return Object.keys(P).filter(id => P[id].ch.some(c => chars.includes(c))); }
function convOf(b, scenes){
  let ids = [];
  if(b.conv === "auto"){
    Object.keys(P).forEach(id => {
      const ok = b.scenes.some(s => scenes[s] && inScene(id, scenes[s]));
      if(!ok) return;
      if(b.only && b.only.length && !P[id].ch.some(c => b.only.includes(c))) return;
      ids.push(id);
    });
  }
  else if(b.conv === "cast") ids = Object.keys(P).filter(id => P[id].ch.length);
  else if(b.conv.startsWith("group:")){ const g = b.conv.slice(6); ids = Object.keys(P).filter(id => P[id].g.includes(g)); }
  else if(b.conv === "chars") ids = castOf(b.chars);
  else if(b.conv === "manual") ids = b.people.slice();
  if(b.conv === "chars" && b.people.length) b.people.forEach(id => { if(!ids.includes(id)) ids.push(id); });
  return ids;
}
function titleOf(b, scenes){
  if(b.title) return b.title;
  let t = b.scenes.map(s => scenes[s] ? scenes[s].name : s).join(" e ");
  if(b.only && b.only.length) t += ", solo "+b.only.join(", ");
  return t || "(scena da scegliere)";
}
function condText(b){ return b.cond.length ? listIt(b.cond.map(pname)) : ""; }
function convLabel(b){
  if(b.conv === "auto") return "dalle scene";
  if(b.conv === "cast") return "tutto il cast";
  if(b.conv.startsWith("group:")) return "tutto il gruppo";
  if(b.conv === "chars") return "personaggio e trucco";
  return "scelti a mano";
}
function canSee(b, pid, scenes){ return inGroup(pid, b.group) || convOf(b, scenes).includes(pid); }
function myRole(b, pid, scenes){
  const p = P[pid];
  if(b.group === "segreti") return p.seg || "";
  if(b.conv.startsWith("group:")) return "";
  if(b.conv === "manual" || (b.conv === "chars" && !p.ch.some(c => b.chars.includes(c)))) return p.role || "";
  let chars;
  if(b.conv === "auto"){ chars = []; b.scenes.forEach(s => { const sc = scenes[s]; if(sc && inScene(pid, sc)) sc.on.forEach(c => chars.push(c)); }); if(b.only.length) chars = chars.filter(c => b.only.includes(c)); }
  else if(b.conv === "chars") chars = b.chars;
  else chars = p.ch;
  const mine = p.ch.filter(c => chars.includes(c));
  return mine.length ? listIt(mine.map(chLabel)) : "";
}

function navItems(pid){

  items.push(["home","I miei impegni","home"]);
  items.push(["sep","Gruppi"]);
  GROUP_ORDER.forEach(g => items.push(["g:"+g, GROUPS[g], "group"]));

}
function navCount(pid, key){
  if(key === "g:direttivo" && ME && ME.scrive.length === 4){ const d = dirtyRows(null); return {n:d, warn:true}; }
  if(key === "g:sartoria" && ME && ME.scrive.length === 1 && ME.scrive[0] === "sartoria"){ const d = dirtyRows("sartoria"); return {n:d, warn:true}; }

}

function whoLine(){
  if(ME.referente) return "Referente tecnico: vedi tutti i gruppi";
  const p = P[ME.id] || {ch:[], g:[], role:""};
  const bits = [];
  if(p.ch.length) bits.push(listIt(p.ch.map(chLabel)));
  else if(p.role) bits.push(p.role);
  bits.push(listIt(GROUP_ORDER.filter(g => memberOf(ME.id, g)).map(g => GROUPS[g])));
  return cap(bits.filter(Boolean).join("; "));
}
function side(){
  const w = {n: ME.nome, s: whoLine()};

function marquee(){
  if(!DEBUT || DEBUT < TODAY) return "";
  const n = daysTo(TODAY, DEBUT);
  const rep = S.pub.filter(b => b.type === "spettacolo" && b.date > DEBUT).length;
  return `<section class="marquee" aria-label="Conto alla rovescia">
    <div class="bulbs"></div>
    <div class="in"><div class="v">${n}</div><div><div class="t">giorni al debutto di Frankenstein Junior</div><div class="d">${cap(fmtDay(DEBUT))} ${DEBUT.slice(0,4)}${rep ? ", poi "+(["","una replica","due repliche","tre repliche","quattro repliche"][rep] || rep+" repliche") : ""} · Si può fare!</div></div>${CASTLE}</div>
    <div class="bulbs"></div>
  </section>`;
}
function mats(b){
  if(b.conv !== "auto") return "";
  const conLink = b.scenes.filter(s => S.pubScenes[s] && /^https?:\/\//.test(S.pubScenes[s].mat || ""));
  if(!conLink.length) return "";
  return `<div class="mats">${conLink.map(s => `<a class="mat" href="${esc(S.pubScenes[s].mat)}" target="_blank" rel="noopener">${ic("link")}Materiali: ${esc(S.pubScenes[s].name)}</a>`).join("")}</div>`;
}
function groupCards(pid){
  const mine = GROUP_ORDER.filter(g => inGroup(pid, g)), sc = S.pubScenes;
  const outCard = g => `<button type="button" class="gcard g-${g} out" data-a="view" data-v="g:${g}"><span class="lk">${ic("lock")}</span><span class="gn">${GROUPS[g]}</span><span class="gx">Non ne fai parte</span></button>`;
  return `<section class="stack" style="gap:8px">
    <div class="groups">${mine.map(g => { const nx = S.pub.filter(b => b.group === g && b.date >= TODAY).sort(byTime)[0];
      return `<button type="button" class="gcard g-${g}" data-a="view" data-v="g:${g}"><span class="gn">${GROUPS[g]}</span><span class="gx">${nx ? esc(cap(fmtDay(nx.date))+": "+titleOf(nx, sc)) : "Nessun impegno in arrivo"}</span></button>`; }).join("")}${GROUP_ORDER.filter(g => !mine.includes(g)).map(outCard).join("")}</div>
    ${mine.length < 4 ? `<div class="lockline">${ic("lock")}<span>Gli altri gruppi li vedi, ma dentro entra solo chi ne fa parte.</span></div>` : ""}
  </section>`;
}
function vHome(){
  const pid = S.role, sc = S.pubScenes;
  const future = S.pub.filter(b => b.date >= TODAY && canSee(b, pid, sc)).sort(byTime);
  const mineAll = future.filter(b => convOf(b, sc).includes(pid) || b.cond.includes(pid));
  const next = mineAll[0];
  let hero = "";
  if(next){
    const sameDay = mineAll.filter(b => b.date === next.date);
    const role = next.cond.includes(pid) ? "conduci tu" : myRole(next, pid, sc), chg = S.changed[next.id];
    hero = `<article class="next g-${next.group}"><div class="bar"></div><div class="body">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">Il tuo prossimo impegno</span><span class="gtag">${GROUPS[next.group]}</span></div>
      <div class="when">${cap(fmtDay(next.date))}, ${next.start}</div>
      ${chg?`<span class="badge b-orange" style="align-self:flex-start">Cambiato: prima era ${esc(chg)}</span>`:""}${S.nuovi && S.nuovi[next.id]?`<span class="badge b-sky" style="align-self:flex-start">Nuovo</span>`:""}
      <dl class="kv">
        <dt>Che cosa</dt><dd><b>${sameDay.map(b => esc(TYPE[b.type]+": "+titleOf(b, sc))).join("<br>")}</b></dd>
        ${role?`<dt>Tu sei</dt><dd>${esc(role)}</dd>`:""}
        ${sameDay.some(condText)?`<dt>Con</dt><dd>${esc(sameDay.map(condText).filter(Boolean).join("; "))}</dd>`:""}
        <dt>Dove</dt><dd>${esc(next.place || "luogo da definire")}${PLACE_ADDR[next.place]?`<span class="muted small"> · ${PLACE_ADDR[next.place]}</span>`:""}</dd>
        ${isRehearsal(next) && next.start==="20.45"?`<dt>Orario</dt><dd>riscaldamento dalle 20.30, inizio puntuale alle 20.45, fine alle 23.30</dd>`:`<dt>Orario</dt><dd>dalle ${next.start} alle ${next.end}</dd>`}
        ${BRING[next.type]?`<dt>Porta</dt><dd>${esc(BRING[next.type])}</dd>`:""}
      </dl>
      ${sameDay.map(mats).join("")}
    </div></article>`;
  }
  const dates = [...new Set(future.map(b => b.date))].filter(d => !next || d !== next.date);
  const removed = S.removed[pid] || [];
  const cards = dates.map(d => {
    const all = future.filter(b => b.date === d), mine = all.filter(b => convOf(b, sc).includes(pid) || b.cond.includes(pid));
    const rem = removed.find(r => r.date === d), x = dt(d);
    const dateHtml = `<div class="date"><span class="dw">${GG[x.getDay()].slice(0,3)}</span><span class="dn">${x.getDate()}</span><span class="mo">${MM[x.getMonth()]}</span></div>`;
    if(mine.length) return `<section class="day">${dateHtml}<div class="evs">${mine.map(b => evRow(b, pid, true)).join("")}</div></section>`;
    if(memberOf(pid, "compagnia") && P[pid].ch.length && all.some(isRehearsal)) return `<section class="day free">${dateHtml}<div class="evs"><div class="freeline">${ic("check")}<span><b>Non sei convocato.</b> Si prova ${esc(listIt(all.filter(isRehearsal).map(b => titleOf(b, sc))))}, ma non ti riguarda: serata libera.</span>${rem?`<span class="badge b-orange">Cambiato: prima eri convocato per ${esc(rem.was)}</span>`:""}</div></div></section>`;
    return "";
  }).join("");
  return `<div class="head"><div>
      <div class="eyebrow">I miei impegni</div>
      <h1>Ciao ${esc(ME.nome.split(" ")[0])}, ecco cosa ti riguarda</h1>
      <p class="sub">${ME.referente ? "Come referente non sei convocato a nulla: da qui entri in tutti i gruppi per controllare che tutto funzioni." : "Gli impegni di tutti i tuoi gruppi a cui sei convocato, in un posto solo. Se c'è prova ma non servi, te lo dice."}</p>
    </div></div>
    ${groupCards(pid)}
    ${marquee()}
    ${hero}
    <div class="days">${cards}</div>`;
}
function evRow(b, pid, mineOnly){
  const sc = S.pubScenes, cv = convOf(b, sc), me = cv.includes(pid) || b.cond.includes(pid);
  const role = b.cond.includes(pid) ? "conduci tu" : (cv.includes(pid) ? myRole(b, pid, sc) : ""), chg = S.changed[b.id];
  const segCast = b.group === "segreti" ? cv.map(id => pname(id)+(P[id].seg?" ("+P[id].seg+")":"")) : null;
  return `<div class="ev g-${b.group} ${!mineOnly && !me ? "dim" : ""}"><div class="tm">${b.start}–${b.end}</div><div>
    <div class="tt">${esc(TYPE[b.type])}: ${esc(titleOf(b, sc))}</div>
    <div class="mt"><span class="gtag">${GROUPS[b.group]}</span>${role?`<span>tu: ${esc(role)}</span>`:""}${condText(b)?`<span>con ${esc(condText(b))}</span>`:""}<span>${b.place?esc(b.place):"luogo da definire"}</span>${!mineOnly&&me?`<span class="badge b-sky">ci sei</span>`:""}${chg?`<span class="badge b-orange">Cambiato: prima era ${esc(chg)}</span>`:""}${S.nuovi && S.nuovi[b.id]?`<span class="badge b-sky">Nuovo</span>`:""}</div>
    ${segCast?`<div class="mt"><span>Cast della serata: ${esc(segCast.join(", "))}</span></div>`:""}
    ${b.type==="costume"||b.type==="laboratorio"?`<div class="mt"><span>Convocati: ${esc(cv.map(pname).join(", "))}</span></div>`:""}
  </div></div>`;
}

/* ===================== PAGINA DI GRUPPO ===================== */
const SUBS = {
  compagnia:[["cal","Calendario"],["scene","Le mie scene"],["membri","Chi c'è"]],
  direttivo:[["cal","Riunioni"],["foglio","Programma"],["mappa","Scene e cast"],["membri","Chi c'è"]],
  segreti:[["cal","Cene"],["membri","Chi c'è"]],
  sartoria:[["cal","Impegni"],["foglio","Gestisci impegni"],["membri","Chi c'è"]]
};
function vGroup(g){
  const pid = S.role;
  if(!inGroup(pid, g)) return `<div class="nope g-${g}"><div class="big">${ic("lock")}</div><span class="gtag">${GROUPS[g]}</span><h2>${NOPE[g][0]}</h2><p>${NOPE[g][1]}</p><button type="button" class="btn sm sec" data-a="view" data-v="home">Torna ai tuoi impegni</button></div>`;
  const members = Object.keys(P).filter(id => memberOf(id, g));
  let subs = SUBS[g];
  if(g === "compagnia" && !(P[pid] && P[pid].ch.length)) subs = subs.filter(s => s[0] !== "scene");
  const puoGestire = g === "direttivo" ? ME.scrive.length === 4 : ME.scrive.includes(g);
  if(!puoGestire) subs = subs.filter(s => s[0] !== "foglio");
  if(!subs.some(s => s[0] === S.sub[g])) S.sub[g] = "cal";
  const sub = S.sub[g];
  let content = "";
  if(sub === "cal") content = groupCal(g, pid);
  else if(sub === "scene") content = vMieScene(pid);
  else if(sub === "membri") content = `<section class="card stack"><p class="small muted">${members.length} persone. Solo loro vedono questa pagina e gli impegni del gruppo.</p><div class="people">${members.map(id => { const p = P[id]; const extra = [p.role, g==="compagnia" && p.ch.length ? p.ch.map(chLabel).join(", ") : "", g==="segreti" && p.seg ? p.seg : ""].filter(Boolean).join(" · "); return `<span class="pp ${id===pid?"me":""}">${esc(p.n)}${extra?` <i>${esc(extra)}</i>`:""}</span>`; }).join("")}</div></section>`;
  else if(sub === "foglio") content = vFoglio(g === "direttivo" ? null : g);

let MONTHS = [];
function calcolaMesi(){
  const ds = S.blocks.concat(S.pub).map(b => b.date).concat([TODAY]).filter(Boolean).sort();
  let a = ds[0].slice(0,7), z = ds[ds.length-1].slice(0,7);
  const fine = addDays(TODAY.slice(0,7)+"-01", 100).slice(0,7); if(fine > z) z = fine;
  if(DEBUT && DEBUT.slice(0,7) > z) z = DEBUT.slice(0,7);
  const out = []; let [y, m] = a.split("-").map(Number);
  while(true){ const k = y+"-"+String(m).padStart(2,"0"); out.push(k); if(k >= z || out.length > 36) break; m++; if(m > 12){ m = 1; y++; } }
  MONTHS = out;
  if(!MONTHS.includes(S.month)) S.month = TODAY.slice(0,7);
}

function defaultConv(type, group){
  if(["coreografia","scena","canto","insieme"].includes(type)) return "auto";
  if(["filato","spettacolo"].includes(type)) return "cast";

  if(type === "cena") return "manual";

}

function edToggle(arr, v){ const i = arr.indexOf(v); if(i === -1) arr.push(v); else arr.splice(i,1); }
function onEd(k, v){
  const b = S.edit.b;
  if(k === "group"){ b.group = v; if(!TYPES_BY_GROUP[v].includes(b.type)) b.type = TYPES_BY_GROUP[v][0]; b.conv = defaultConv(b.type, v); if(v !== "compagnia"){ b.scenes = []; b.only = []; b.cond = []; } if(v === "direttivo" || v === "segreti"){ b.chars = []; } if(v !== "compagnia") b.people = b.people.filter(id => inGroup(id, v)); }
  else if(k === "type"){ b.type = v; b.conv = defaultConv(v, b.group); if(!["coreografia","scena","canto","insieme"].includes(v)) b.cond = []; }
  else if(k === "conv"){ b.conv = v === "group" ? "group:"+b.group : v; }
  else if(k === "scene"){ edToggle(b.scenes, v); b.only = b.only.filter(c => b.scenes.some(s => S.scenes[s].on.includes(c))); }
  else if(k === "only") edToggle(b.only, v);
  else if(k === "chars") edToggle(b.chars, v);
  else if(k === "people") edToggle(b.people, v);
  else if(k === "cond") edToggle(b.cond, v);
  else if(k === "place"){ if(v === "__altro"){ S.edit.otherPlace = true; if(PLACES.includes(b.place)) b.place = ""; } else { b.place = v; S.edit.otherPlace = false; } }
  S.edit.armed = false;
}
function saveEdit(){
  const b = S.edit.b;
  if(b.conv === "auto" && !b.scenes.length){ toast("Scegli almeno una scena, oppure un altro modo di convocare."); return; }
  if(b.conv !== "auto" && !b.title.trim()) b.title = TYPE[b.type];
  if(b.conv !== "auto"){ b.scenes = []; b.only = []; }
  const copia = clone(b);
  const i = S.blocks.findIndex(x => x.id === copia.id);
  if(i === -1) S.blocks.push(copia); else S.blocks[i] = copia;
  S.month = copia.date.slice(0,7); S.edit = null; S.modal = null; S.issues = null;

}
function addDays(iso, n){ const x = dt(iso); x.setDate(x.getDate()+n); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }

function runCheck(scope){
  return runCheckAll().filter(x => !scope || (x.rows||[]).some(id => { const b = S.blocks.find(y => y.id === id); return b && b.group === scope; }));
}
function runCheckAll(){
  const out = [], rows = S.blocks.filter(b => b.date >= TODAY);
  [...new Set(rows.map(b => b.date))].forEach(d => {
    const bs = rows.filter(b => b.date === d), seen = {};
    for(let i=0;i<bs.length;i++) for(let j=i+1;j<bs.length;j++){
      const a = bs[i], c = bs[j];
      if(mins(a.start) < mins(c.end) && mins(c.start) < mins(a.end)){
        convOf(a, S.scenes).filter(id => convOf(c, S.scenes).includes(id)).forEach(id => { const k = id+a.id+c.id; if(!seen[k]){ seen[k]=1; out.push({k:"warn", rows:[a.id,c.id], t:`<b>${esc(pname(id))}</b> ha due impegni nello stesso momento, ${esc(fmtDay(d))}: «${esc(titleOf(a,S.scenes))}» e «${esc(titleOf(c,S.scenes))}». Si può fare, ma va deciso cosa fa prima.`}); } });
      }
    }
  });
  rows.forEach(b => {
    if(["coreografia","scena","canto","insieme"].includes(b.type) && !b.cond.length) out.push({k:"bad", rows:[b.id], t:`${esc(cap(fmtDay(b.date)))}, ${b.start}: manca chi conduce «${esc(titleOf(b,S.scenes))}».`});
    if(!b.place) out.push({k:"bad", rows:[b.id], t:`${esc(cap(fmtDay(b.date)))}, ${b.start}: manca il luogo.`});
    if(!convOf(b, S.scenes).length) out.push({k:"bad", rows:[b.id], t:`${esc(cap(fmtDay(b.date)))}: nessuno risulta convocato per «${esc(titleOf(b,S.scenes))}».`});
  });
  return out;
}
function publish(scope){
  const notes = [], affected = new Set(), lines = [];
  const ids = [...new Set([...S.blocks.filter(b => inScope(b, scope)).map(b => b.id), ...S.pub.filter(b => inScope(b, scope)).map(b => b.id)])];
  ids.forEach(id => {
    const b = S.blocks.find(x => x.id === id), old = S.pub.find(x => x.id === id);
    const oldCv = old ? convOf(old, S.pubScenes) : [], newCv = b ? convOf(b, S.scenes) : [];
    const ref = b || old, day = cap(fmtDay(ref.date));
    const oldT = old ? titleOf(old, S.pubScenes) : "", newT = b ? titleOf(b, S.scenes) : "";
    if(!old){ lines.push(`${day}, ${b.start}: nuovo impegno, ${TYPE[b.type].toLowerCase()} «${newT}».`); newCv.forEach(id2 => { affected.add(id2); notes.push([id2, `Nuovo impegno: ${fmtDay(b.date)} alle ${b.start}, ${TYPE[b.type].toLowerCase()}: ${newT}.`]); }); return; }
    if(!b){ lines.push(`${day}, ${old.start}: annullato «${oldT}».`); oldCv.forEach(id2 => { affected.add(id2); notes.push([id2, `Annullato: ${fmtDay(old.date)}, ${oldT}. Serata libera.`]); }); return; }
    const timeCh = old.date !== b.date || old.start !== b.start || old.end !== b.end;
    const changedContent = oldT !== newT || old.place !== b.place || JSON.stringify(old.cond) !== JSON.stringify(b.cond) || timeCh;
    if(!changedContent && JSON.stringify(oldCv) === JSON.stringify(newCv)) return;
    if(oldT !== newT){ lines.push(`${day}: si prova ${newT} invece di ${oldT}.`); }
    else if(timeCh){ lines.push(`«${newT}» spostato a ${fmtDay(b.date)}, ${b.start}.`); }
    else if(old.place !== b.place) lines.push(`${day}, ${b.start}: luogo ${b.place || "da definire"}.`);
    else if(JSON.stringify(old.cond) !== JSON.stringify(b.cond)) lines.push(`${day}, ${b.start}: conduce ${condText(b) || "da definire"}.`);
    newCv.filter(x => !oldCv.includes(x)).forEach(x => { affected.add(x); notes.push([x, `Nuova convocazione: ${fmtDay(b.date)} alle ${b.start}, ${TYPE[b.type].toLowerCase()}: ${newT}. Ci vediamo in sala.`]); });
    oldCv.filter(x => !newCv.includes(x)).forEach(x => { affected.add(x); notes.push([x, `${cap(fmtDay(b.date))} non sei più convocato: ${oldT} non si prova. Serata libera.`]); });
    if(changedContent) newCv.filter(x => oldCv.includes(x)).forEach(x => { affected.add(x); notes.push([x, `Cambio per ${fmtDay(b.date)}: ${oldT !== newT ? `si prova ${newT} invece di ${oldT}` : timeCh ? `ora è ${fmtDay(b.date)} alle ${b.start}` : "controlla luogo e chi conduce"}.`]); });
  });
  const msg = lines.length ? `Programma aggiornato.\n${lines.join("\n")}\nTutti gli impegni, con chi è convocato, sono nell'app.` : `Programma aggiornato: cambiano alcune convocazioni. Controllate l'app.`;
  const lastPub = {n:affected.size, who:[...affected], msg};
  S.pub = scope ? clone(S.pub.filter(b => b.group !== scope).concat(S.blocks.filter(b => b.group === scope))) : clone(S.blocks.filter(b => !ME || ME.scrive.includes(b.group)).concat(S.pub.filter(b => ME && !ME.scrive.includes(b.group))));
  lastPub.stato = "invio";
  S.lastPub = lastPub; S.issues = null; S.modal = "pub"; render();
  inCoda({azione:"pubblica", ambito:scope || null, messaggio:msg}).then(() => { lastPub.stato = "ok"; if(S.modal === "pub") renderModal(); }, err => { lastPub.stato = "errore"; lastPub.errore = err.message; if(S.modal === "pub") renderModal(); });
}

/* ===================== DIRETTIVO: SCENE E CAST ===================== */

    </section>

/* ===================== GUIDA E FINESTRE ===================== */
function modal(){
  if(S.modal === "edit" && S.edit) return editorHTML();
  if(S.modal !== "pub" || !S.lastPub) return "";
  const p = S.lastPub;
  return `<div class="veil" data-a="close"><div class="dlg" role="dialog" aria-modal="true" aria-label="Pubblicato">
    <div class="row"><h2>Pubblicato</h2><button type="button" class="x" data-a="close" aria-label="Chiudi">${ic("x")}</button></div>
    ${p.stato === "invio" ? `<div class="notice">${ic("refresh")}<div>Invio al foglio in corso… puoi già copiare il messaggio.</div></div>` : p.stato === "errore" ? `<div class="notice bad">${ic("alert")}<div>${esc(p.errore || "Pubblicazione non riuscita.")} Riprova a premere Pubblica.</div></div>` : ""}
    <div class="notice ok">${ic("check")}<div>${p.stato === "ok" ? "Fatto: l'app è aggiornata per tutti." : "Appena il foglio conferma, l'app sarà aggiornata per tutti."} ${p.n ? `Il cambio riguarda <b>${p.n} ${p.n===1?"persona":"persone"}</b>: ${esc(listIt(p.who.map(pname))).replace(/\.$/,"")}. Lo vedono evidenziato alla prossima apertura dell'app.` : "Nessuna convocazione è cambiata."}</div></div>
    <div class="stack" style="gap:6px"><b>Messaggio pronto per la bacheca WhatsApp</b><div class="wa" id="wamsg">${esc(p.msg)}</div>
      <button type="button" class="btn sm sec" data-a="copywa" style="align-self:flex-start">${ic("copy")}Copia il messaggio</button></div>
    <p class="small muted">Le notifiche sul telefono arriveranno con la fase 2. Per ora incolla il messaggio nella bacheca, così WhatsApp resta il canale che conoscete.</p>
  </div></div>`;
}

/* ===================== RENDER ===================== */
function body(){
  const v = S.view[S.role];
  if(v === "prove") return vProve();
  if(v && v.startsWith("g:")) return vGroup(v.slice(2));
  return vHome();
}
function render(){
  if(!ME) return;
  const y = window.scrollY;
  const dl = document.querySelector(".dlg"), dy = dl ? dl.scrollTop : 0;
  const main = body();
  document.getElementById("app").innerHTML = header() + `<div class="shell">${side()}<main id="main">${main}</main></div>` + modal() + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : "");
  window.scrollTo(0, y);
  const dl2 = document.querySelector(".dlg"); if(dl2 && dl && dy) dl2.scrollTop = dy;
  document.documentElement.classList.toggle("modale-aperta", !!S.modal);
}
function resetSubs(){ Object.keys(S.sub).forEach(g => S.sub[g] = SUBS[g][0][0]); }
let toastT = null;
function mostraToast(){ document.querySelectorAll(".toast").forEach(n => n.remove()); if(!S.toast) return; const n = document.createElement("div"); n.className = "toast"; n.setAttribute("role","status"); n.textContent = S.toast; document.getElementById("app").appendChild(n); }
function toast(t){ S.toast = t; mostraToast(); clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; mostraToast(); }, 3200); }
function renderModal(){
  const v = document.querySelector(".veil");
  if(!v){ render(); return; }
  const dl = v.querySelector(".dlg"), dy = dl ? dl.scrollTop : 0;
  const tmp = document.createElement("div"); tmp.innerHTML = modal();
  const nv = tmp.firstElementChild;
  if(!nv){ v.remove(); document.documentElement.classList.remove("modale-aperta"); return; }
  v.replaceWith(nv);
  const dl2 = nv.querySelector(".dlg"); if(dl2) dl2.scrollTop = dy;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if(!el) return;
  if(el.classList.contains("veil") && e.target !== el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if(a === "view"){ if(S.view[S.role] !== v) resetSubs(); S.view[S.role] = v; render(); window.scrollTo(0,0); }
  else if(a === "sub"){ S.sub[el.dataset.g] = v; render(); }
  else if(a === "calmine"){ S.calMine = true; render(); }
  else if(a === "calall"){ S.calMine = false; render(); }
  else if(a === "check"){ S.issues = runCheck(S.scope); render(); }
  else if(a === "publish"){ if(!S.busy) publish(S.scope); }
  else if(a === "close"){ S.modal = null; render(); }
  else if(a === "month"){ const i = MONTHS.indexOf(S.month) + Number(v); if(MONTHS[i]){ S.month = MONTHS[i]; S.issues = null; } render(); }
  else if(a === "add"){ S.edit = {b:newBlock(v, S.scope), isNew:true}; S.modal = "edit"; render(); }
  else if(a === "edit"){ S.edit = {b:clone(S.blocks.find(x => x.id === v)), isNew:false}; S.modal = "edit"; render(); }
  else if(a === "dup"){ const o = clone(S.blocks.find(x => x.id === v)); o.id = "n"+Date.now().toString(36); o.date = addDays(o.date, 7); S.edit = {b:o, isNew:true}; S.modal = "edit"; render(); }
  else if(a === "ed"){ onEd(el.dataset.k, v); renderModal(); }
  else if(a === "closeedit"){ S.edit = null; S.modal = null; render(); }
  else if(a === "saveedit"){ if(!S.busy) saveEdit(); }
  else if(a === "deledit"){ if(S.edit.armed){ const id = S.edit.b.id; S.blocks = S.blocks.filter(x => x.id !== id); S.edit = null; S.modal = null; S.issues = null; render(); toast("Eliminato in bozza: sparisce per tutti quando pubblichi."); inCoda({azione:"elimina", id}); } else { S.edit.armed = true; renderModal(); } }
  else if(a === "refresh"){ aggiorna(true); }
  else if(a === "copywa"){ const t = S.lastPub ? S.lastPub.msg : ""; try{ navigator.clipboard.writeText(t).then(() => toast("Messaggio copiato: incollalo nella bacheca."), () => { selectWa(); toast("Testo selezionato: copialo con il menu del telefono."); }); }catch(err){ selectWa(); } }
});
function selectWa(){ const n = document.getElementById("wamsg"); if(!n) return; const r = document.createRange(); r.selectNodeContents(n); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener("input", e => {
  const t = e.target, k = t.dataset.e; if(!k || !S.edit) return;
  if(k === "title" || k === "place") S.edit.b[k] = t.value;
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.e && S.edit){ const k = t.dataset.e, b = S.edit.b;
    if(k === "date" && t.value) b.date = t.value;
    else if((k === "start" || k === "end") && t.value) b[k] = t.value.replace(":",".");
    else if(k === "title" || k === "place") b[k] = t.value.trim();
    renderModal(); return; }
  const f = t.dataset.f; if(!f) return;
  const b = S.blocks.find(x => x.id === t.dataset.b); if(!b) return;
  if(f === "scene"){ const i = +t.dataset.i; if(t.value) b.scenes[i] = t.value; else b.scenes.splice(i,1); b.scenes = b.scenes.filter(Boolean); b.only = []; }
  else if(f === "place"){ b.place = t.value.trim(); }
  S.issues = null; render();
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && S.modal && !S.busy){ S.modal = null; S.edit = null; render(); } });

/* ===================== COLLEGAMENTO AL FOGLIO ===================== */
const CHIAVE_K = "dm-k", CHIAVE_DATI = "dm-dati", CHIAVE_VISTO = "dm-visto";
let CODICE = null, VISTO_PRIMA = null, ultimoAgg = 0;
function mem(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
function api(){ return (typeof INDIRIZZO_SCRIPT === "string" && /^https:\/\/script\.google\.com\//.test(INDIRIZZO_SCRIPT)) ? INDIRIZZO_SCRIPT : null; }

function schermata(html){ document.getElementById("app").innerHTML = `<div class="boot"><img src="${LOGO}" alt="DreaMusical Teatro">${html}</div>`; }
function chiediCodice(errore){
  schermata(`${errore ? `<div class="notice bad">${ic("alert")}<div>${esc(errore)}</div></div>` : ""}
    <h1>Chi sei?</h1>
    <p class="sub">Si entra dal proprio link personale, quello ricevuto in privato. Se l'app non ti riconosce, incolla qui il codice che ti ha dato il referente.</p>
    <input id="codice" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="il tuo codice">
    <button type="button" class="btn" id="entra">Entra</button>`);
  document.getElementById("entra").onclick = () => {
    const v = document.getElementById("codice").value.trim();
    if(!v) return;
    CODICE = v; mem(CHIAVE_K, v); avvia(true);
  };
}

/* applica i dati arrivati dal foglio */
function applyData(d){
  ME = d.me; S.role = ME.id;
  const imp = d.impostazioni || {};
  DEBUT = imp.debutto || "";
  PLACES = (imp.luoghi && imp.luoghi.length) ? imp.luoghi : ["Teatro"];
  VENUE = PLACES[0];
  PLACE_ADDR = imp.indirizzi || {};
  DEF_START = imp.inizio || "20.45"; DEF_END = imp.fine || "23.30";
  P = d.persone || {};
  if(!P[ME.id]) P[ME.id] = {n:ME.nome, g:[], role:"", ch:[], cond:""};
  SCENE_ORDER = (d.ordine || []).filter(id => d.scene && d.scene[id]);
  S.scenes = d.scene || {}; S.pubScenes = S.scenes;
  const chs = ["Frederick","Igor","Inga","Frau Blücher","Elizabeth","Mostro","Kemp","Eremita","Ziggy","Victor","Mr. Hilltop","Araldo","Postino","Steward","Mordecai","Fox","Dracula"].filter(c => Object.keys(P).some(id => P[id].ch.includes(c)) || SCENE_ORDER.some(id => (S.scenes[id].on || []).includes(c)));
  SCENE_ORDER.forEach(id => (S.scenes[id].on || []).forEach(c => { if(c !== "Ensemble" && !chs.includes(c)) chs.push(c); }));
  Object.keys(P).forEach(id => P[id].ch.forEach(c => { if(c !== "Ensemble" && !chs.includes(c)) chs.push(c); }));
  chs.push("Ensemble"); CHARS = chs;
  CONDUCTORS = Object.keys(P).filter(id => P[id].cond);
  const norm = b => Object.assign({scenes:[], only:[], cond:[], people:[], chars:[], title:"", place:"", note:""}, b);
  S.pub = (d.pubblicati || []).map(norm);
  if(ME.scrive.length && d.bozza){
    const bz = d.bozza.map(norm);
    S.blocks = ME.scrive.length === 4 ? bz : bz.concat(S.pub.filter(b => !ME.scrive.includes(b.group)).map(clone));
  } else S.blocks = clone(S.pub);
  if(!S.view[S.role]) S.view[S.role] = "home";
  TODAY = oggiISO();
  calcolaMesi();
  confrontaConPrima();
}

/* cosa è cambiato per me dall'ultima volta che ho aperto l'app (su questo telefono) */
function miaFoto(){
  const sc = S.pubScenes, me = S.role, foto = {};
  S.pub.forEach(b => { if(convOf(b, sc).includes(me) || b.cond.includes(me)) foto[b.id] = {d:b.date, s:b.start, t:titleOf(b, sc)}; });
  return foto;
}
function confrontaConPrima(){
  const ora = miaFoto(), me = S.role;
  if(VISTO_PRIMA === null){
    try{ VISTO_PRIMA = JSON.parse(mem(CHIAVE_VISTO + "-" + me) || "null"); }catch(e){ VISTO_PRIMA = null; }
    if(!VISTO_PRIMA) VISTO_PRIMA = false;
  }
  S.changed = {}; S.removed = {}; S.nuovi = {};
  if(VISTO_PRIMA){
    Object.keys(ora).forEach(id => {
      const p = VISTO_PRIMA[id], n = ora[id];
      if(!p){ if(n.d >= TODAY) S.nuovi[id] = true; return; }
      if(p.t !== n.t) S.changed[id] = p.t;
      else if(p.d !== n.d || p.s !== n.s) S.changed[id] = cap(fmtDay(p.d)) + " alle " + p.s;
    });
    Object.keys(VISTO_PRIMA).forEach(id => { const p = VISTO_PRIMA[id]; if(!ora[id] && p.d >= TODAY) (S.removed[me] = S.removed[me] || []).push({date:p.d, was:p.t}); });
  }
  mem(CHIAVE_VISTO + "-" + me, JSON.stringify(ora));
}

function ricevuti(d){
  mem(CHIAVE_DATI, JSON.stringify({k:CODICE, d:d}));
  S.offline = false; S.sync = ""; S.syncAt = Date.now(); ultimoAgg = Date.now();
  applyData(d); render();
}

/* scrive nel foglio: salva, elimina, pubblica */
function chiama(body){
  if(!api()) return Promise.reject(new Error("Manca l'indirizzo dello script in config.js."));
  return fetch(api(), {method:"POST", body:JSON.stringify(Object.assign({k:CODICE}, body)), redirect:"follow"})
    .then(r => r.json(), () => { throw new Error("Non riesco a contattare il foglio: controlla la connessione e riprova."); })
    .then(d => {
      if(!d.ok){
        const m = {permesso:"Non hai il permesso di modificare questo gruppo.", dati:"Qualche dato non va: controlla giorno e orari.", codice:"Il tuo codice non è più valido: chiedi un link nuovo al referente."}[d.errore];
        throw new Error(m || ("Errore del foglio: " + (d.dettaglio || d.errore)));
      }
      if(d.me) ricevuti(d);
      return d;
    });
}

/* le scritture partono una dopo l'altra, senza far aspettare chi usa l'app */
let coda = Promise.resolve(), inAttesa = 0;
function statoBarra(){ const h = document.querySelector(".sync span"); if(h) h.innerHTML = inAttesa ? "salvataggio…" : (S.syncAt ? "aggiornato alle " + new Date(S.syncAt).toTimeString().slice(0,5).replace(":", ".") : ""); }
function inCoda(body){
  inAttesa++; statoBarra();
  const p = coda.then(() => chiama(body)).then(d => {
    inAttesa--; S.syncAt = Date.now(); statoBarra();
    if(!inAttesa) setTimeout(() => { if(!inAttesa && !S.modal) aggiorna(false); }, 1500);
    return d;
  }, err => {
    inAttesa--; statoBarra();
    toast(err.message + " Ricarico i dati dal foglio.");
    setTimeout(() => aggiorna(false), 800);
    throw err;
  });
  coda = p.catch(() => {});
  return p;
}
window.addEventListener("beforeunload", e => { if(inAttesa){ e.preventDefault(); e.returnValue = ""; } });

/* legge dal foglio */
function aggiorna(manuale){
  if(!manuale && (S.modal === "edit" || inAttesa)) return;
  if(!api()){ schermata(`<div class="notice bad">${ic("alert")}<div>Manca l'indirizzo dello script nel file config.js.</div></div>`); return; }
  if(!ME) schermata(`<p class="sub">Carico il calendario…</p>`);
  S.sync = "busy"; render();
  return fetch(api() + "?k=" + encodeURIComponent(CODICE), {redirect:"follow"})
    .then(r => r.json())
    .then(d => {
      if(!d.ok){
        if(d.errore === "codice"){ mem(CHIAVE_K, null); mem(CHIAVE_DATI, null); ME = null; CODICE = null; chiediCodice("Codice non riconosciuto: controlla il link personale o chiedine uno nuovo al referente."); return; }
        throw new Error(d.dettaglio || d.errore);
      }
      if(inAttesa){ S.sync = ""; statoBarra(); return; }
      ricevuti(d);
      if(manuale) toast("Aggiornato.");
    })
    .catch(() => {
      S.sync = ""; S.offline = true;
      if(ME){ render(); if(manuale) toast("Non riesco ad aggiornare: mostro gli ultimi dati salvati."); }
      else schermata(`<div class="notice bad">${ic("alert")}<div>Non riesco a contattare il foglio e non ho dati salvati su questo telefono. Controlla la connessione.</div></div><button type="button" class="btn" onclick="location.reload()">Riprova</button>`);
    });
}

function avvia(ignoraLink){
  const q = ignoraLink ? null : new URLSearchParams(location.search).get("k");
  if(q){ CODICE = q.trim(); mem(CHIAVE_K, CODICE); }
  else if(!CODICE) CODICE = mem(CHIAVE_K);
  if(!CODICE){ chiediCodice(); return; }
  try{
    const c = JSON.parse(mem(CHIAVE_DATI) || "null");
    if(c && c.k === CODICE && c.d && c.d.ok){ applyData(c.d); S.syncAt = c.d.ora ? Date.parse(c.d.ora) : null; render(); }
  }catch(e){}
  aggiorna(false);
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && CODICE && Date.now() - ultimoAgg > 60000 && !S.busy && !S.edit) aggiorna(false);
});

avvia();

</script>
